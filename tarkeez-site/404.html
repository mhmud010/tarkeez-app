<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>الصفحة غير موجودة — تركيز | Page not found — Focus</title>
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#000;color:#ecebe6;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:24px;text-align:center}
  main{max-width:420px}
  .code{font-size:4.5rem;font-weight:800;color:#7fa389;line-height:1}
  h1{font-size:1.3rem;margin:12px 0 6px}
  p{color:#9a9a94;line-height:1.8;margin:0 0 22px}
  a{display:inline-block;background:#7fa389;color:#000;text-decoration:none;font-weight:700;padding:12px 28px;border-radius:99px}
  a:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>الصفحة غير موجودة<br><small style="font-weight:500;color:#9a9a94">Page not found</small></h1>
  <p>الرابط الذي فتحته غير صحيح أو تم نقله.<br>The link you opened is invalid or has moved.</p>
  <a href="/">العودة للرئيسية · Back home</a>
</main>
</body>
</html>
